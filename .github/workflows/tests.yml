name: tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

# Test-only values: throwaway service containers, never real credentials.
env:
  TEST_DATABASE_URL: postgresql://wasiyuq:wasiyuq@127.0.0.1:55432/wasiyuq_test
  DB_MIGRATION_ALLOWED_DATABASES: wasiyuq_test
  MAILPIT_API_URL: http://127.0.0.1:58025
  MAILPIT_SMTP_PORT: "51025"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Isolated, throwaway PostgreSQL for integration tests (never a real or legacy database).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wasiyuq
          POSTGRES_PASSWORD: wasiyuq
          POSTGRES_DB: wasiyuq_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wasiyuq -d wasiyuq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SMTP sink for the email integration test.
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 51025:1025
          - 58025:8025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Apply migrations to test database
        run: bun run --filter @wasiyuq/db db:migrate:test

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Fails on any critical advisory. Lower severities are printed in full (accepted ones are documented in
      # docs/technical/SECURITY_DECISIONS.md) and reviewed on every dependency change.
      - name: Dependency audit (fail on critical)
        run: bun audit --audit-level=critical

      - name: Dependency audit (full report)
        run: bun audit || echo "::warning::non-critical advisories present; see docs/technical/SECURITY_DECISIONS.md"

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wasiyuq
          POSTGRES_PASSWORD: wasiyuq
          POSTGRES_DB: wasiyuq_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wasiyuq -d wasiyuq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 51025:1025
          - 58025:8025
    env:
      AUTH_SECRET: ci-only-e2e-secret-not-used-anywhere-else-0123456789
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations to test database
        run: bun run --filter @wasiyuq/db db:migrate:test

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Browser E2E
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
