services:
  postgres:
    image: postgres:16-alpine
    container_name: wasiyuq-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wasiyuq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wasiyuq}
      POSTGRES_DB: ${POSTGRES_DB:-wasiyuq_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wasiyuq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wasiyuq} -d ${POSTGRES_DB:-wasiyuq_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wasiyuq_postgres_data:
